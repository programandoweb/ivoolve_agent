name: Verify Hermes Browser Extension
on:
  push:
    paths:
      - 'extensions/hermes-researcher/**'
      - '.github/workflows/verify-hermes-browser.yml'
  pull_request:
    paths:
      - 'extensions/hermes-researcher/**'
      - '.github/workflows/verify-hermes-browser.yml'
permissions:
  contents: read
jobs:
  build-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/hermes-researcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Hermes MV3 worker
        run: npm run build
      - name: Validate manifest and generated assets
        run: |
          node -e "const m=require('./manifest.json'); if (m.manifest_version!==3 || m.background.service_worker!=='dist/background.js' || m.side_panel.default_path!=='sidepanel.html') process.exit(1)"
          test -s dist/background.js
          test -s dist/observe.js
          test -s dist/sidepanel.js
          test -s sidepanel.html
