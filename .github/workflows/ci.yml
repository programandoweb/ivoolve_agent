name: Validate Ivoolve Agent

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        # El backend es un proyecto independiente dentro del monorepo.
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        run: npm install

      - name: Build NestJS backend
        run: npm run build
