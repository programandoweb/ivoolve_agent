services:
  redis:
    image: redis:7-alpine
    container_name: ivoolve-agent-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ivoolve_agent_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mariadb:
    image: mariadb:11.8
    container_name: ivoolve-agent-mariadb
    environment:
      MARIADB_DATABASE: ivoolve_agent
      MARIADB_USER: ivoolve
      MARIADB_PASSWORD: ivoolve
      MARIADB_ROOT_PASSWORD: ivoolve-root
    ports:
      - "3307:3306"
    volumes:
      - ivoolve_agent_mariadb_data:/var/lib/mysql
    healthcheck:
      test:
        ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  ivoolve_agent_redis_data:
  ivoolve_agent_mariadb_data:
